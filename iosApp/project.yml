name: iosApp
options:
  bundleIdPrefix: app.bertsatlas
  deploymentTarget:
    iOS: "15.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: false
    preBuildScripts:
      - name: Sync Compose resources
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:syncComposeResourcesForIos
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bertsatlas
        PRODUCT_NAME: "Bert's Atlas"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
